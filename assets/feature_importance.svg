ze="11.5" fill="#0f172a">is_weekend</text><rect class="grow" style="animation-delay:0.4s" x="210" y="269" width="165.7" height="18" rx="3" fill="#0891b2" opacity="0.92"/><text class="reveal" style="animation-delay:1.0s" x="384.6909090909091" y="282" font-size="10.5" font-weight="700" fill="#64748b">0.070</text><text x="196" y="315" text-anchor="end" font-size="11.5" fill="#0f172a">workingday</text><rect class="grow" style="animation-delay:0.48s" x="210" y="302" width="136.6" height="18" rx="3" fill="#0891b2" opacity="0.92"/><text class="reveal" style="animation-delay:1.08s" x="355.6181818181818" y="315" font-size="10.5" font-weight="700" fill="#64748b">0.058</text><text x="196" y="348" text-anchor="end" font-size="11.5" fill="#0f172a">yr</text><rect class="grow" style="animation-delay:0.56s" x="210" y="335" width="101.2" height="18" rx="3" fill="#7c3aed" opacity="0.92"/><text class="reveal" style="animation-delay:1.1600000000000001s" x="320.16363636363633" y="348" font-size="10.5" font-weight="700" fill="#64748b">0.043</text><text x="196" y="381" text-anchor="end" font-size="11.5" fill="#0f172a">temp</text><rect class="grow" style="animation-delay:0.64s" x="210" y="368" width="98.3" height="18" rx="3" fill="#d97706" opacity="0.92"/><text class="reveal" style="animation-delay:1.24s" x="317.3272727272727" y="381" font-size="10.5" font-weight="700" fill="#64748b">0.042</text><text x="196" y="414" text-anchor="end" font-size="11.5" fill="#0f172a">season</text><rect class="grow" style="animation-delay:0.72s" x="210" y="401" width="88.6" height="18" rx="3" fill="#d97706" opacity="0.92"/><text class="reveal" style="animation-delay:1.3199999999999998s" x="307.6363636363636" y="414" font-size="10.5" font-weight="700" fill="#64748b">0.037</text><rect x="548" y="58" width="9" height="9" rx="2" fill="#2563eb"/><text x="562" y="67" font-size="10" fill="#64748b">Time</text><rect x="626" y="58" width="9" height="9" rx="2" fill="#0891b2"/><text x="640" y="67" font-size="10" fill="#