<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="340" viewBox="0 0 1240 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">End-to-end workflow</title>
  <desc id="svg-desc">Animated pipeline from raw hourly data to a deployed Streamlit forecast.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
    .label { font-size: 11px; letter-spacing: 2.2px; fill: #64748b; font-weight: 600; }
    .heading { font-size: 21px; fill: #0f172a; font-weight: 700; }
    .note { font-size: 10.5px; fill: #64748b; }
    @keyframes reveal { from { opacity: 0; } }
    @keyframes grow { from { width: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    .reveal { animation: reveal 0.6s ease-out both; }
    .grow { animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.8s ease-out both; }
  </style>
  <rect width="1240" height="340" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1239" height="339" rx="16" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="36" class="label">END-TO-END WORKFLOW</text><text x="40" y="66" class="heading">From raw hourly records to a deployed forecast</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect x="40" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="40" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></rect><circle cx="62" cy="135" r="10" fill="#eff6ff"/><text x="62" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">01</text><text x="115.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">Data ingestion</text><text x="115.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">hour.csv</text><text x="115.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">17,379 rows</text><rect x="235" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="235" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></rect><circle cx="257" cy="135" r="10" fill="#eff6ff"/><text x="257" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">02</text><text x="310.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">EDA and cleaning</text><text x="310.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">leakage checks</text><text x="310.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">0 nulls</text><rect x="430" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="430" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></rect><circle cx="452" cy="135" r="10" fill="#eff6ff"/><text x="452" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">03</text><text x="505.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">Feature engineering</text><text x="505.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">22 features</text><text x="505.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">time + weather</text><rect x="625" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="625" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="1.7999999999999998s" repeatCount="indefinite"/></rect><circle cx="647" cy="135" r="10" fill="#eff6ff"/><text x="647" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">04</text><text x="700.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">Model training</text><text x="700.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">XGBoost</text><text x="700.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">150 trees</text><rect x="820" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="820" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></rect><circle cx="842" cy="135" r="10" fill="#eff6ff"/><text x="842" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">05</text><text x="895.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">Validation</text><text x="895.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">R2 0.9522</text><text x="895.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">RMSE 38.90</text><rect x="1015" y="112" width="150" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/><rect x="1015" y="112" width="150" height="100" rx="12" fill="none" stroke="#2563eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.38;0" keyTimes="0;0.5;1" dur="3.6s" begin="3.0s" repeatCount="indefinite"/></rect><circle cx="1037" cy="135" r="10" fill="#eff6ff"/><text x="1037" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">06</text><text x="1090.0" y="166" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f172a">Deployment</text><text x="1090.0" y="185" text-anchor="middle" font-size="10.5" fill="#64748b">Streamlit</text><text x="1090.0" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">real-time</text><path d="M190,155 L226,155" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path><circle r="3.2" fill="#2563eb" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.2s" fill="freeze"/><animateMotion dur="1.2s" begin="0.0s" repeatCount="indefinite" path="M194,155 L228,155"/></circle><path d="M385,155 L421,155" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path><circle r="3.2" fill="#2563eb" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.2s" fill="freeze"/><animateMotion dur="1.2s" begin="0.45s" repeatCount="indefinite" path="M389,155 L423,155"/></circle><path d="M580,155 L616,155" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path><circle r="3.2" fill="#2563eb" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.2s" fill="freeze"/><animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite" path="M584,155 L618,155"/></circle><path d="M775,155 L811,155" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path><circle r="3.2" fill="#2563eb" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.2s" fill="freeze"/><animateMotion dur="1.2s" begin="1.35s" repeatCount="indefinite" path="M779,155 L813,155"/></circle><path d="M970,155 L1006,155" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path><circle r="3.2" fill="#2563eb" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.2s" fill="freeze"/><animateMotion dur="1.2s" begin="1.8s" repeatCount="indefinite" path="M974,155 L1008,155"/></circle><text x="620" y="308" text-anchor="middle" class="note">Training window 2011-2012  |  Target log(1 + cnt)  |  Evaluation on the count scale</text>
</svg>
