t="44" rx="2" fill="#d97706"/><text x="348" y="167" font-size="12.5" font-weight="700" fill="#0f172a">bike_demand_xgboost_bundle.pkl</text><text x="348" y="182" font-size="10.5" fill="#64748b">trained model, regime map, feature schema</text></g><path d="M234,212 C272,212 292,228 330,228" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></path><g class="reveal" style="animation-delay:0.6000000000000001s"><rect x="330" y="206" width="460" height="44" rx="10" fill="#ffffff" stroke="#dbe3ee"/><rect x="330" y="206" width="4" height="44" rx="2" fill="#16a34a"/><text x="348" y="225" font-size="12.5" font-weight="700" fill="#0f172a">app.py</text><text x="348" y="240" font-size="10.5" fill="#64748b">interactive Streamlit dashboard</text></g><path d="M234,212 C272,212 292,286 330,286" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></path><g class="reveal" style="animation-delay:0.8s"><rect x="330" y="264" width="460" height="44" rx="10" fill="#ffffff" stroke="#dbe3ee"/><rect x="330" y="264" width="4" height="44" rx="2" fill="#0891b2"/><text x="348" y="283" font-size="12.5" font-weight="700" fill="#0f172a">figures/</text><text x="348" y="298" font-size="10.5" fill="#64748b">EDA and model diagnostic charts</text></g><path d="M234,212 C272,212 292,344 330,344" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></path><g class="reveal" style="animation-delay:1.0s"><rect x="330" y="322" width="460" height="44" rx="10" fill="#ffffff" stroke="#dbe3ee"/><rect x="330" y="322" width="4" height="44" rx="2" fill="#64748b"/><text x="348" y="341" font-size="12.5" font-weight="700" fill="#0f172a">README.md + docs</text><text x="348" y="356" font-size="10.5" fill="#64748b">summary, project guide, audit findings</text></g><rect x="830" y="30" width="340" height="356" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="852" y="58" class="label">QUICK START</text><rect x="852" y="72" width="296" height="86" rx="8" fill="#0f172a"/><text x="868" y="102" class="mono" font-size="11" fill="#e2e8f0">$ streamlit run app.py</text><rect x="1040" y="93" width="7" height="11" fill="#e2e8f0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect><text x="868" y="126" class="mono" font-size="10" fill="#94a3b8">Local URL  http://localhost:8501</text><line x1="852" y1="184" x2="1148" y2="184" stroke="#e2e8f0"/><text x="852" y="210" class="label">MODEL SNAPSHOT</text><text x="852" y="242" font-size="11.5" fill="#64748b">Holdout R2</text><text x="1148" y="242" text-anchor="end" font-size="13" font-weight="700" fill="#2563eb">0.9522</text><text x="852" y="276" font-size="11.5" fill="#64748b">RMSE</text><text x="1148" y="276" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">38.90 bikes/hr</text><text x="852" y="310" font-size="11.5" fill="#64748b">MAE</text><text x="1148" y="310" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">23.23 bikes/hr</text><text x="852" y="350" class="note">Training window: January 2011 to December 2012</text>
</svg>
