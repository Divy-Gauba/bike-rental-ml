<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Model leaderboard</title>
  <desc id="svg-desc">Animated bar chart of holdout RMSE for five model families.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
    .label { font-size: 11px; letter-spacing: 2.2px; fill: #64748b; font-weight: 600; }
    .heading { font-size: 21px; fill: #0f172a; font-weight: 700; }
    .note { font-size: 10.5px; fill: #64748b; }
    @keyframes reveal { from { opacity: 0; } }
    @keyframes grow { from { width: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    .reveal { animation: reveal 0.6s ease-out both; }
    .grow { animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.8s ease-out both; }
  </style>
  <rect width="900" height="430" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="16" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="36" class="label">HOLDOUT PERFORMANCE</text><text x="40" y="66" class="heading">RMSE by model - lower is better</text><line x1="200.0" y1="84" x2="200.0" y2="356" stroke="#eef2f7"/><text x="200.0" y="382" text-anchor="middle" font-size="10" fill="#64748b">0</text><line x1="335.0" y1="84" x2="335.0" y2="356" stroke="#eef2f7"/><text x="335.0" y="382" text-anchor="middle" font-size="10" fill="#64748b">50</text><line x1="470.0" y1="84" x2="470.0" y2="356" stroke="#eef2f7"/><text x="470.0" y="382" text-anchor="middle" font-size="10" fill="#64748b">100</text><line x1="605.0" y1="84" x2="605.0" y2="356" stroke="#eef2f7"/><text x="605.0" y="382" text-anchor="middle" font-size="10" fill="#64748b">150</text><line x1="740.0" y1="84" x2="740.0" y2="356" stroke="#eef2f7"/><text x="740.0" y="382" text-anchor="middle" font-size="10" fill="#64748b">200</text><text x="188" y="113" text-anchor="end" font-size="12" fill="#0f172a">XGBoost</text><rect class="grow" style="animation-delay:0.0s" x="200" y="96" width="105.0" height="24" rx="4" fill="#2563eb" opacity="0.95"/><text class="reveal" style="animation-delay:0.7s" x="314.03" y="113" font-size="11.5" font-weight="700" fill="#0f172a">38.90</text><text x="188" y="169" text-anchor="end" font-size="12" fill="#0f172a">Random Forest</text><rect class="grow" style="animation-delay:0.15s" x="200" y="152" width="110.7" height="24" rx="4" fill="#64748b" opacity="0.95"/><text class="reveal" style="animation-delay:0.85s" x="319.727" y="169" font-size="11.5" font-weight="700" fill="#0f172a">41.01</text><text x="188" y="225" text-anchor="end" font-size="12" fill="#0f172a">Hist Gradient Boosting</text><rect class="grow" style="animation-delay:0.3s" x="200" y="208" width="111.2" height="24" rx="4" fill="#94a3b8" opacity="0.95"/><text class="reveal" style="animation-delay:1.0s" x="320.186" y="225" font-size="11.5" font-weight="700" fill="#0f172a">41.18</text><text x="188" y="281" text-anchor="end" font-size="12" fill="#0f172a">Ridge Regression</text><rect class="grow" style="animation-delay:0.44999999999999996s" x="200" y="264" width="343.4" height="24" rx="4" fill="#cbd5e1" opacity="0.95"/><text class="reveal" style="animation-delay:1.15s" x="552.44" y="281" font-size="11.5" font-weight="700" fill="#0f172a">127.20</text><text x="188" y="337" text-anchor="end" font-size="12" fill="#0f172a">Dummy Regressor</text><rect class="grow" style="animation-delay:0.6s" x="200" y="320" width="536.8" height="24" rx="4" fill="#e2e8f0" opacity="0.95"/><text class="reveal" style="animation-delay:1.2999999999999998s" x="745.841" y="337" font-size="11.5" font-weight="700" fill="#0f172a">198.83</text><text x="450" y="412" text-anchor="middle" class="note">Random 80/20 holdout. See FLAGS_AND_LIMITATIONS.md for the temporal-leakage caveat.</text>
</svg>
